constraints:
- id: CONST-0018
  type: technical
  description: 'Canned query functions accept only a WorkspaceGraph (loaded from slices/*.yaml)
    as their data source. They do not access the per-repo RECON graph (AidocGraph),
    the file system, or any external service.

    '
  rationale: 'Keeps queries deterministic and testable with in-memory fixtures. Cross-layer
    enrichment from the RECON graph is deferred to a follow-up slice.

    '
invariants:
- id: 019ff84e-4ece-7ffd-8202-831399ecb2a0
  statement: 'Canned query functions (systemDependencies, componentIntegration, blastRadiusWorkspace)
    are pure graph traversal. They do not invoke LLM inference, network calls, or
    non-deterministic operations.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Determinism is the defining property of canned queries. If an LLM were
    involved, the output would be non-reproducible and untestable with fixture-based
    assertions.

    '
  alias_id: INV-0020
  alias_name: inv-0020
- id: 019ff84e-4ece-7329-8c34-bbee9f5aea8f
  statement: 'Projection is separated from query. Query functions return structured
    data objects. Rendering to Mermaid, table, or matrix is performed by distinct
    projection functions.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Separation enables adding new output formats (PlantUML, D2, CSV) in
    follow-up slices without modifying query logic.

    '
  alias_id: INV-0021
  alias_name: inv-0021
- id: 019ff84e-4ece-72b6-b03e-1a80a8098665
  statement: 'Every emitted projection file includes projection_level metadata in
    its YAML frontmatter, identifying the resolution level (L0-L4) at which the projection
    was generated.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Projection level metadata enables downstream consumers to identify the
    abstraction level of a projection file, determine whether drill-down or drill-up
    navigation is available, and detect staleness via the accompanying generation
    hash.

    '
  alias_id: INV-0024
  alias_name: inv-0024
decisions:
- id: 019ff84e-4ece-7f12-ae27-d1eafc11b6eb
  summary: Workspace graph queries are deterministic graph traversal with no LLM inference
  rationale: "Three standard questions (system dependencies, component integration,\
    \ blast\nradius) are answerable purely from the typed verb edges in workspace\
    \ slices.\nMaking them deterministic:\n\n1. Guarantees reproducibility (same graph\
    \ -> same result).\n2. Enables fixture-based unit testing without mocking LLM\
    \ responses.\n3. Runs in <10ms even for large workspaces (pure BFS/DFS on adjacency\
    \ maps).\n4. Complements rather than replaces CQI (ADR-L-0006), which handles\n\
    \   intent-classified natural language queries.\n"
  alternatives_considered:
  - name: Extend CQI with workspace-level intents
    rejected_because: 'CQI is session-cached and intent-classified, designed for interactive
      exploration. Canned queries need to be stateless, reproducible, and callable
      from CLI and programmatic API without LLM overhead.

      '
  - name: Build queries on top of existing AidocGraph loader
    rejected_because: 'AidocGraph uses untyped bidirectional edges (references/referenced_by)
      and cannot load workspace slice YAML (different schema). A new typed loader
      was required.

      '
  consequences:
    positive:
    - Three standard questions answered without LLM cost or latency.
    - Results are reproducible and testable with in-memory fixtures.
    - Multiple output projections (Mermaid, table, matrix) from one query.
    - Serves CLI, MCP, and programmatic API surfaces from the same engine.
    negative:
    - New loader required (workspace slices were previously unloadable).
    - No natural language flexibility; exact node IDs required for blast radius target.

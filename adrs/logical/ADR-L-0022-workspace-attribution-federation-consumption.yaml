context: 'Per-repo RECON emits implementation-attribution-evidence.yaml with bare

  ADR-L-XXXX ids scoped to each repository manifest. The same bare id string

  may denote different decisions in different repos (for example ADR-L-0013 in

  adr-architecture-kit vs ste-runtime).


  Federation authority and qualified identity are defined in

  adr-architecture-kit ADR-L-0012 (accepted). ste-runtime consumes that model

  at the workspace boundary: after workspace RECON completes for all manifest

  repos, it invokes adr-architecture-kit `adr attribution workspace-report` to

  write a derived `.ste-workspace/workspace-attribution-federation.yaml` keyed

  by `{workspaceRepoKey}:{bareAdrId}`.


  This artifact is derived state, not canonical architecture authority. Per-repo

  attribution validation (`adr attribution check --scope <repo>`) is unchanged.

  '
invariants:
- id: 019ff84e-4ecf-72fc-ac2e-e3fa368a279d
  statement: 'Workspace attribution federation MUST NOT mutate per-repo attribution
    evidence

    or ADR corpora; it only reads state and manifests to emit a derived index.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Aligns with federation read-only aggregation (adr-architecture-kit ADR-L-0012).

    '
  alias_id: INV-0033
  alias_name: inv-0033
- id: 019ff84e-4ecf-7f97-9239-716da8f2a953
  statement: 'Federation embodiment counts MUST be computed per qualified_id only;
    bare ADR

    ids shared across repos MUST NOT have embodiment counts summed across corpora.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Prevents homonym collapse at workspace reasoning time.

    '
  alias_id: INV-0034
  alias_name: inv-0034
decisions:
- id: 019ff84e-4ecf-7f43-883e-e837e388c71b
  summary: ste-runtime orchestrates workspace federation via adr-kit CLI after workspace
    RECON
  rationale: 'Federation merge logic lives in adr-architecture-kit as single authority;

    ste-runtime must not duplicate merge in TypeScript.

    '
  decision: 'executeWorkspaceRecon invokes `adr attribution workspace-report

    --workspace-root <.ste-workspace>` after all per-repo RECON completes.

    Output path is `.ste-workspace/workspace-attribution-federation.yaml`.

    '
  alias_id: DEC-0024
  alias_name: ste-runtime-orchestrates-workspace-federation-via-adr-kit-cli-after-workspace-recon
consequences:
  positive:
  - Cross-repo ADR traceability without qualified decorators in source
  - Complementary embodiment on shared bare ids remains visible as separate clusters
  negative:
  - Workspace runs require adr-architecture-kit on PATH or documented venv
alias_id: ADR-L-0022
alias_name: workspace-attribution-federation-consumption

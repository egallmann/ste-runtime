decisions:
- id: 019ff84e-4ecf-7c22-9a1f-3ea5fed35b00
  summary: Add a supplied-relationship MVC-S candidate traversal boundary
  rationale: 'A deterministic traversal helper lets runtime test candidate expansion
    before

    production RSS traversal. The helper consumes only caller-supplied

    relationship records and emits MVC-S candidate output through the existing

    candidate builder.

    '
  decision: 'Implement breadth-first, depth-bounded candidate expansion over supplied

    relationship records. Relationship following uses exact canonical ref

    equality from currently expanded candidate refs to relationship from_ref,

    adding to_ref as the next candidate. Traversal does not derive inverse edges

    or infer missing relationships. If records are supplied inside a Linkage

    Surface-shaped object, runtime extracts relationship_records only and

    delegates to the same supplied-record traversal helper.

    '
  alternatives_considered:
  - name: Build Graph Domains first
    rejected_because: 'Graph Domain materialization would expand this gate beyond
      candidate-only

      traversal and blur authority boundaries.

      '
  - name: Reuse workspace graph traversal
    rejected_because: 'Workspace graph loading and production RSS traversal are outside
      this

      experimental MVC-S boundary.

      '
  - name: Emit MVC-M from traversal output
    rejected_because: 'MVC-M requires kernel-owned admission and is outside runtime
      authority.

      '
  consequences:
    positive:
    - Candidate traversal can be tested before production RSS assembly
    - Rationale and negative space can be generated from deterministic paths
    - Runtime authority remains factual and candidate-only
    negative:
    - Traversal is intentionally limited and does not discover missing graph state

      '
    alias_id: IFACE-0012
    alias_name: iface-0012
  implementation_identifiers:
    module_path: src/extractors/adr-yaml/index.ts
    test_path: src/extractors/adr-yaml/adr-yaml-extractor.test.ts
  implementation_requirements:
    error_handling:
      strategy: Skip malformed or unrecognized ADR YAML files with warning log; never
        crash the pipeline.
    observability:
      logging:
        level: warn
        structured: false
      metrics:

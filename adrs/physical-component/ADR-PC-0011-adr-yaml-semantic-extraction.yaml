component_specifications:
- id: 019ff84e-4ecf-7422-913f-540519905503
  name: ADR YAML Semantic Extractor
  type: library
  responsibilities: "- Detect and classify ADR YAML files via path-prefix and content\
    \ sniffing\n- Parse ADR YAML using js-yaml\n- Extract ADR documents, invariants,\
    \ decisions, capabilities, component\n  specifications, and system boundaries\
    \ as RawAssertions\n- Emit source provenance (serialized YAML snippets) for traceability\n\
    - Handle failure paths: malformed YAML, missing adr_type, unknown adr_type\n"
  generation_context:
    purpose: Extract semantic entities from ADR YAML corpus for RECON architecture
      domain.
    key_responsibilities:
    - ADR YAML discovery and classification
    - Multi-type entity extraction (6 element types)
    - Architecture domain slice population
    constraints:
    - Extraction remains deterministic and path-driven
    - ADR YAML classification takes precedence over CloudFormation for files under
      adrs/
    - Unknown adr_type values are skipped with warning, not errors
    success_criteria:
    - ADR entities are represented as queryable architecture domain slices
    - Failure paths produce zero assertions without crashing the pipeline
    - At least 90 architecture slices emitted from ste-runtime self-pass
  interfaces:
  - id: 019ff84e-4ecf-7384-be0f-def4e12f395d
    type: library_api
    specification: 'Public surfaces:


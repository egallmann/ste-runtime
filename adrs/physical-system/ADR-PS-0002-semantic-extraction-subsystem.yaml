context: 'ste-runtime extraction is now a subsystem containing multiple first-class

  extractors and normalization flows rather than a pair of isolated physical

  slices. This ADR groups the implemented extractor estate under a concrete

  system boundary.

  '
technology_stack:
- category: language
  name: TypeScript
  version: 5.3+
  rationale: Existing implementation language.
- category: framework
  name: Node.js
  version: 18.x+
  rationale: Existing execution environment.
system_boundaries:
- id: SYSBOUND-0002
  name: Semantic Extraction Boundary
  description: 'Encapsulates domain-specific extraction of semantic assertions and
    related

    normalization inputs for RECON.

    '
  external_dependencies:
  - Source files discovered by RECON
  - CloudFormation resource specifications
  exposed_interfaces:
  - extractor modules invoked by RECON phases
component_topology:
  components:
  - name: JSON Semantic Extractor
    type: service
    purpose: Extract semantic entities from JSON control, schema, and config files.
    implements_adr: 019ff84e-4ecf-7117-853b-c869ac6d7ba6
  - name: Frontend Semantic Extractor
    type: service
    purpose: Extract Angular and CSS/SCSS semantics.
    implements_adr: 019ff84e-4ecf-73e1-8c0f-19a06db3004b
  - name: CloudFormation Semantic Extractor
    type: service
    purpose: Extract CloudFormation resources, relations, and implementation intent.
    implements_adr: 019ff84e-4ecf-721a-b936-e1b98d068ec7
  - name: ADR YAML Semantic Extractor
    type: service
    purpose: Extract ADR documents, invariants, decisions, capabilities, components,
      and system boundaries from ADR YAML corpus.
    implements_adr: 019ff84e-4ecf-7a82-ae3a-121886af1b51
  - name: Extractor Validation Framework
    type: service
    purpose: Validate extractor output quality and derived-state consistency.
    implements_adr: 019ff876-6daf-773a-b017-7d967b7a7add
  relationships:
  - from: JSON Semantic Extractor
    to: Frontend Semantic Extractor
    type: depends_on
    description: Shared normalization and discovery patterns remain aligned across
      extractor types.
  - from: Frontend Semantic Extractor
    to: CloudFormation Semantic Extractor
    type: depends_on
    description: All extractor outputs feed the same RECON normalization pipeline.

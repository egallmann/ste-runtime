    metadata:
      adr_id: 019ff84e-4ece-76ad-ae3e-f92bef05635a
      scope: global
      statement: >-
        All infrastructure resources extracted by RECON are emitted as workspace graph nodes. No extracted resource is
        silently dropped by the slice emitter. Resources not covered by an explicit CFN-to-graph-type mapping are
        emitted as InfraResource nodes with the original cfn_type preserved in attributes. The logicalId is the
        last-resort display name; a null name never causes a node to be dropped.
      enforcement_level: must
      declaration_mode: local
      upheld_by_decisions: []

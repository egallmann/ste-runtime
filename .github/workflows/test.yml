name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build TypeScript
      run: npm run build
    
    - name: Run tests
      run: npm test

  portability:
    name: OS portability / ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies and repository hooks
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run unit tests
      run: npm test

  contract:
    name: Contract qualification / Ubuntu / Node 22
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies and repository hooks
      run: npm ci

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    - name: Run contract guards
      run: npm run test:contract-guards

    - name: Prove architecture compiler
      run: npm run test:integration

    - name: Prove public tarball consumer
      run: npm run test:public-tarball

    - name: Verify public-source release policy
      run: npm run release:check

    - name: Verify RECON self-documentation
      run: npm run recon:self

  required:
    name: required
    if: ${{ always() }}
    needs:
      - test
      - portability
      - contract
    runs-on: ubuntu-latest
    steps:
    - name: Verify mandatory test jobs succeeded
      env:
        TEST_RESULT: ${{ needs.test.result }}
        PORTABILITY_RESULT: ${{ needs.portability.result }}
        CONTRACT_RESULT: ${{ needs.contract.result }}
      run: |
        if [ "$TEST_RESULT" != "success" ] || [ "$PORTABILITY_RESULT" != "success" ] || [ "$CONTRACT_RESULT" != "success" ]; then
          echo "Required test gate failed: test=$TEST_RESULT portability=$PORTABILITY_RESULT contract=$CONTRACT_RESULT"
          exit 1
        fi

